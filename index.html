<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>grid</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      background: #0a0a0a;
      color: #e0e0e0;
      max-width: 640px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
      line-height: 1.6;
    }
    a { color: #4ade80; text-decoration: none; }
    a:hover { text-decoration: underline; }
    h1 { font-size: 2rem; margin-bottom: 0.3rem; }
    .subtitle { color: #888; margin-bottom: 3rem; }
    h2 {
      font-size: 1rem;
      color: #4ade80;
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    section { margin-bottom: 3rem; }
    ul { list-style: none; }
    li { margin-bottom: 0.5rem; }
    li a { color: #e0e0e0; }
    li a:hover { color: #4ade80; }
    .tag {
      display: inline-block;
      background: #1a1a1a;
      padding: 0.2rem 0.5rem;
      border-radius: 3px;
      font-size: 0.8rem;
      color: #888;
      margin-right: 0.3rem;
    }
    footer {
      margin-top: 4rem;
      color: #555;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <h1>grid</h1>
  <p class="subtitle">maker / hardware / code</p>

  <section>
    <h2>Proyectos</h2>
    <ul>
      <li><a href="https://github.com/nachogzalazar.blip/custom-lightpad">hackpad 9-key</a> <span class="tag">kicad</span><span class="tag">rp2040</span><span class="tag">kmk</span></li>
    </ul>
  </section>

  <section>
    <h2>Intereses</h2>
    <ul>
      <li>teclados mecánicos</li>
      <li>pcb design</li>
      <li>3d printing</li>
      <li>embedded</li>
    </ul>
  </section>

  <section>
    <h2>Links</h2>
    <ul>
      <li><a href="https://github.com/nachogzalazar.blip">github</a></li>
    </ul>
  </section>

  <footer>
    <p>hecho con html + css. sin frameworks.</p>
  </footer>

</body>
</html>
