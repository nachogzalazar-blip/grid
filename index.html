<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>grid — hardware & code</title>

<style>
/* Custom Variables - Modern Hardware/Cyberpunk Palette */
:root {
--bg: #080809;
--surface: #111113;
--surface-hover: #161619;
--border: #222226;
--border-focus: #33333c;
--text: #f0f0f3;
--muted: #888893;
--accent: #4ade80;
--accent-dim: #1e5e3a;
--accent-glow: rgba(74, 222, 128, 0.15);
--font-mono: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
--transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

* {
margin: 0;
padding: 0;
box-sizing: border-box;
}

html {
scroll-behavior: smooth;
scroll-padding-top: 90px;
}

body {
font-family: var(--font-mono);
background-color: var(--bg);
/* Subtle technical grid background using CSS gradients */
background-image:
linear-gradient(rgba(255, 255, 255, 0.007) 1px, transparent 1px),
linear-gradient(90deg, rgba(255, 255, 255, 0.007) 1px, transparent 1px);
background-size: 30px 30px;
background-position: center top;
color: var(--text);
max-width: 100%;
margin: 0;
line-height: 1.75;
-webkit-font-smoothing: antialiased;
-moz-osx-font-smoothing: grayscale;
}

/* Custom Scrollbar */
::-webkit-scrollbar {
width: 6px;
height: 6px;
}
::-webkit-scrollbar-track {
background: var(--bg);
}
::-webkit-scrollbar-thumb {
background: var(--border);
border-radius: 3px;
}
::-webkit-scrollbar-thumb:hover {
background: var(--accent-dim);
}

/* Navbar Glassmorphism */
nav {
position: sticky;
top: 0;
width: 100%;
background: rgba(8, 8, 9, 0.85);
border-bottom: 1px solid var(--border);
padding: 1.25rem 2rem;
display: flex;
align-items: center;
gap: 2.5rem;
z-index: 100;
backdrop-filter: blur(12px);
-webkit-backdrop-filter: blur(12px);
}

nav .logo {
font-size: 1.3rem;
font-weight: 800;
color: var(--accent);
letter-spacing: -0.05em;
flex-shrink: 0;
display: flex;
align-items: center;
gap: 0.5rem;
}

nav .logo::before {
content: '';
display: inline-block;
width: 8px;
height: 8px;
background: var(--accent);
border-radius: 50%;
box-shadow: 0 0 8px var(--accent);
}

nav ul {
list-style: none;
display: flex;
gap: 2rem;
align-items: center;
flex: 1;
overflow-x: auto;
scrollbar-width: none;
}

nav ul::-webkit-scrollbar {
display: none;
}

nav li {
flex-shrink: 0;
}

nav a {
color: var(--muted);
text-decoration: none;
font-size: 0.85rem;
font-weight: 500;
transition: var(--transition);
position: relative;
padding: 0.25rem 0;
}

nav a:hover {
color: var(--text);
}

nav a::after {
content: '';
position: absolute;
bottom: 0;
left: 0;
width: 0;
height: 1px;
background: var(--accent);
transition: var(--transition);
}

nav a:hover::after {
width: 100%;
}

.language-selector {
display: flex;
gap: 0.4rem;
flex-shrink: 0;
background: rgba(255, 255, 255, 0.02);
padding: 0.2rem;
border-radius: 4px;
border: 1px solid var(--border);
}

.language-selector button {
background: transparent;
border: none;
color: var(--muted);
font-family: inherit;
font-size: 0.75rem;
font-weight: bold;
padding: 0.3rem 0.6rem;
border-radius: 3px;
cursor: pointer;
transition: var(--transition);
}

.language-selector button:hover {
color: var(--text);
}

.language-selector button.active {
color: var(--bg);
background: var(--accent);
}

/* Container & Layout */
.container {
max-width: 800px;
margin: 0 auto;
padding: 5rem 2rem;
}

section {
margin: 5rem 0;
padding-bottom: 4rem;
border-bottom: 1px solid var(--border);
animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
}

section:last-child {
border-bottom: none;
}

/* Typography */
h1 {
font-size: 3rem;
font-weight: 800;
letter-spacing: -0.03em;
margin-bottom: 0.5rem;
background: linear-gradient(135deg, var(--text) 60%, var(--muted));
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
}

h2 {
font-size: 0.8rem;
color: var(--accent);
text-transform: uppercase;
letter-spacing: 0.2em;
margin-bottom: 2rem;
display: flex;
align-items: center;
gap: 0.75rem;
}

h2::after {
content: '';
height: 1px;
flex-grow: 1;
background: linear-gradient(90deg, var(--border) 0%, transparent 100%);
}

h3 {
font-size: 1.1rem;
font-weight: 600;
color: var(--text);
}

.subtitle {
color: var(--muted);
font-size: 1.1rem;
margin-bottom: 3rem;
}

.subtitle::after {
content: '_';
color: var(--accent);
animation: blink 1s step-end infinite;
}

/* Stats Grid */
.stats-grid {
display: grid;
grid-template-columns: repeat(4, 1fr);
gap: 1.25rem;
}

.stat-card {
background: var(--surface);
border: 1px solid var(--border);
border-radius: 8px;
padding: 1.5rem 1rem;
text-align: center;
transition: var(--transition);
position: relative;
overflow: hidden;
}

.stat-card::before {
content: '';
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 2px;
background: var(--accent);
transform: scaleX(0);
transform-origin: left;
transition: var(--transition);
}

.stat-card:hover {
transform: translateY(-4px);
border-color: var(--border-focus);
background: var(--surface-hover);
box-shadow: 0 10px 30px -15px rgba(0, 0, 0, 0.5);
}

.stat-card:hover::before {
transform: scaleX(1);
}

.stat-num {
display: block;
font-size: 2.2rem;
color: var(--accent);
font-weight: 800;
line-height: 1.2;
margin-bottom: 0.25rem;
}

.stat-label {
font-size: 0.75rem;
color: var(--muted);
text-transform: uppercase;
letter-spacing: 0.05em;
}

/* Project Cards */
.project-card {
background: var(--surface);
border: 1px solid var(--border);
border-radius: 8px;
padding: 1.75rem;
margin-bottom: 1.5rem;
transition: var(--transition);
position: relative;
}

border-color: var(--accent-dim);
background: var(--surface-hover);
