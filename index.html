<html lang="es">
<head>
<meta charset="UTF-8">
<title>grid — hardware & code</title>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* 1️⃣ Design Variables – Dark, Neon‑Green palette */
:root{
--bg:#080809;
--surface:#111113;
--surface-hover:#161619;
--border:#222226;
--border-focus:#33333c;
--text:#f0f0f3;
--muted:#888893;
--accent:#4ade80;
--accent-dim:#1e5e3a;
--accent-glow:rgba(74,222,128,0.15);
--accent-glow-strong:rgba(74,222,128,0.25);
--font-mono:'JetBrains Mono',monospace;
--transition-fast:all 0.2s cubic-bezier(.4,0,.2,1);
--transition-normal:all 0.3s cubic-bezier(.4,0,.2,1);
--transition-slow:all 0.4s cubic-bezier(.4,0,.2,1);
}

/* 2️⃣ Global Reset & Base Styling */
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;scroll-padding-top:90px;}
body{
font-family:var(--font-mono);
background-color:var(--bg);
background-image:
linear-gradient(rgba(255,255,255,.008) 1px,transparent 1px),
linear-gradient(90deg,rgb(255,255,255,.008) 1px,transparent 1px);
background-size:30px 30px;
background-position:center top;
color:var(--text);
line-height:1.75;
overflow-x:hidden;
-webkit-font-smoothing:antialiased;
-moz-osx-font-smoothing:grayscale;
}

/* 3️⃣ Custom Scrollbar */
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border-focus);border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:var(--accent-dim);}

/* 4️⃣ Navbar – Glassmorphism + Glow */
nav{
position:sticky;top:0;width:100%;background:rgba(8,8,9,.85);
border-bottom:1px solid var(--border);
padding:1.25rem 2rem;
display:flex;align-items:center;gap:2.5rem;
backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
box-shadow:0 4px 20px rgba(0,0,0,.3);
z-index:100;
}
nav .logo{font-size:1.35rem;font-weight:800;color:var(--accent);letter-spacing:-.05em;display:flex;align-items:center;gap:.5rem;text-shadow:0 0 8px var(--accent-glow);}
nav .logo::before{content:'';display:inline-block;width:9px;height:9px;background:var(--accent);border-radius:50%;box-shadow:0 0 10px var(--accent-glow-strong);animation:pulse-dot 2s infinite ease-in-out;}
@keyframes pulse-dot{0%{transform:scale(1)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
nav ul{list-style:none;display:flex;gap:2rem;align-items:center;flex:1;overflow-x:auto;scrollbar-width:none;}
nav ul::-webkit-scrollbar{display:none;}
nav a{color:var(--muted);text-decoration:none;font-size:.9rem;font-weight:500;transition:var(--transition-fast);position:relative;padding:.25rem 0;}
nav a:hover{color:var(--text);text-shadow:0 0 5px var(--accent-glow);}
nav a::after{content:'';position:absolute;bottom:-3px;left:0;width:0;height:2px;background:var(--accent);transition:var(--transition-fast);border-radius:1px;}
nav a:hover::after{width:100%;box-shadow:0 0 8px var(--accent-glow);}

/* 5️⃣ Language Selector – Modern Buttons */
.language-selector{display:flex;gap:.4rem;flex-shrink:0;background:rgba(255,255,255,.03);padding:.25rem;border-radius:6px;border:1px solid var(--border-focus);box-shadow:inset 0 1px 3px rgba(0,0,0,.3);}
.language-selector button{background:transparent;border:none;color:var(--muted);font-family:inherit;font-size:.78rem;font-weight:600;padding:.4rem .7rem;border-radius:4px;cursor:pointer;transition:var(--transition-fast);letter-spacing:.05em;}
.language-selector button:hover{color:var(--text);background:rgba(255,255,255,.05);}
.language-selector button.active{color:var(--bg);background:var(--accent);box-shadow:0 0 12px var(--accent-glow-strong),inset 0 1px 3px rgba(0,0,0,.4);transform:translateY(-1px);}

/* 6️⃣ Container & Section Layout */
.container{max-width:840px;margin:0 auto;padding:5rem 2rem;}
section{margin:5rem 0;padding-bottom:4rem;border-bottom:1px solid var(--border);animation:fadeUp .8s cubic-bezier(.16,1,.3,1) both;}
section:last-child{border-bottom:none;padding-bottom:0;}
@keyframes fadeUp{0%{opacity:0;transform:translateY(15px)}100%{opacity:1;transform:translateY(0)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(74,222,128,.4)}70%{box-shadow:0 0 0 7px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}

/* 7️⃣ Typography */
h1{font-size:3.5rem;font-weight:800;letter-spacing:-.04em;margin-bottom:.75rem;background:linear-gradient(135deg,var(--text) 50%,var(--muted));-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 0 15px rgba(74,222,128,.1);}
h2{font-size:.85rem;color:var(--accent);text-transform:uppercase;letter-spacing:.25em;margin-bottom:2.5rem;display:flex;align-items:center;gap:1rem;font-weight:600;}
h2::before{content:'';height:1px;flex-grow:0.2;background:linear-gradient(270deg,var(--border) 0%,transparent 100%);}
h2::after{content:'';height:1px;flex-grow:1;background:linear-gradient(90deg,var(--border) 0%,transparent 100%);}
h3{font-size:1.15rem;font-weight:600;color:var(--text);line-height:1.4;}
p{font-size:1rem;color:var(--muted);margin-bottom:1rem;}
.subtitle{color:var(--muted);font-size:1.2rem;margin-bottom:3.5rem;font-weight:400;}
.subtitle::after{content:'_';color:var(--accent);animation:blink 1s step-end infinite;font-weight:600;}

/* 8️⃣ Stats Grid – Interactive Cards */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.5rem;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1.75rem 1.25rem;text-align:center;transition:var(--transition-normal);position:relative;overflow:hidden;box-shadow:0 4px 15px rgba(0,0,0,.2);}
.stat-card::before{content:'';position:absolute;top:0;left:0;width:100%;height:3px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:var(--transition-normal);}
.stat-card:hover{transform:translateY(-5px);border-color:var(--accent-dim);background:var(--surface-hover);box-shadow:0 15px 40px -10px rgba(0,0,0,.6);}
.stat-card:hover::before{transform:scaleX(1);box-shadow:0 0 15px var(--accent-glow);}
.stat-num{display:block;font-size:2.5rem;color:var(--accent);font-weight:800;line-height:1.2;margin-bottom:.4rem;text-shadow:0 0 10px var(--accent-glow);}
.stat-label{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;}

/* 9️⃣ Project Cards – Sleeker */
.project-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:2rem;margin-bottom:1.5rem;transition:var(--transition-normal);position:relative;box-shadow:0 4px 15px rgba(0,0,0,.2);}
.project-card:hover{border-color:var(--accent);background:var(--surface-hover);transform:translateY(-3px);box-shadow:0 15px 30px -10px rgba(0,0,0,.5);}
.project-card h3{margin-bottom:.5rem;}
.project-card h3 a{color:var(--text);text-decoration:none;transition:var(--transition-fast);display:inline-block;}
.project-card h3 a:hover{color:var(--accent);transform:translateX(5px);text-shadow:0 0 8px var(--accent-glow);}
.project-card p{color:var(--muted);font-size:.95rem;margin-bottom:1rem;}
.tag{display:inline-block;background:var(--bg);border:1px solid var(--border-focus);padding:.3rem .7rem;border-radius:4px;font-size:.75rem;color:var(--muted);margin-right:.3rem;margin-bottom:.2rem;}

/* 10️⃣ Skill Bars – Modern */
.skill{margin-bottom:1.5rem;}
.skill-header{display:flex;justify-content:space-between;font-size:.85rem;margin-bottom:.4rem;}
.skill-bar{height:6px;background:var(--surface);border-radius:3px;overflow:hidden;}
.skill-fill{height:100%;background:var(--accent);border-radius:3px;animation:fillBar 1.2s ease-out;}
@keyframes fillBar{0%{width:0}}
/* 11️⃣ Timeline – Vertical */
.timeline{position:relative;padding-left:1.5rem;}
.timeline::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--border);}
.timeline-item{position:relative;margin-bottom:2rem;padding-left:1rem;}
.timeline-item:last-child{margin-bottom:0;}
.timeline-dot{position:absolute;left:-1.75rem;top:.3rem;width:10px;height:10px;background:var(--accent);border-radius:50%;box-shadow:0 0 0 0 rgba(74,222,128,.4);animation:pulse 2s infinite;}
.timeline-date{font-size:.75rem;color:var(--accent);text-transform:uppercase;}
.timeline-item p{color:var(--muted);font-size:.9rem;margin-top:.2rem;}
/* 12️⃣ Blog – Simple List */
.blog-post{padding:.8rem 0;border-bottom:1px solid var(--border);}
.blog-post:last-child{border-bottom:none;}
.blog-post a{color:var(--text);text-decoration:none;transition:var(--transition-fast);}
.blog-post a:hover{color:var(--accent);}
.blog-post span{color:var(--muted);font-size:.8rem;}
/* 13️⃣ Contact Links */
.contact-links{display:flex;gap:1.5rem;flex-wrap:wrap;}
.contact-links a{color:var(--accent);text-decoration:none;font-size:.9rem;transition:var(--transition-fast);}
.contact-links a:hover{text-decoration:underline;}
/* 14️⃣ Footer */
footer{text-align:center;padding:2rem;color:var(--muted);font-size:.75rem;border-top:1px solid var(--border);}

/* 15️⃣ Responsive Breakpoints – from Awwwards “Responsive” trends */
@media (max-width:700px){
nav{padding:1rem 1.5rem;gap:1.5rem;}
nav ul{gap:1rem;}
nav a{font-size:.8rem;}
.container{padding:4rem 1.5rem;}
h1{font-size:3rem;}
.stats-grid{grid-template-columns:repeat(2,1fr);}
}
@media (max-width:450px){
nav{gap:.7rem;}
nav .logo{font-size:1rem;}
.language-selector button{font-size:.7rem;padding:.2rem .35rem;}
.stats-grid{grid-template-columns:repeat(1,1fr);}
}
</style>
</head>

<ul>

<h1>grid</h1>
<p class="subtitle" data-es="maker / hardware
